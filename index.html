<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mckeand Technologies</title>
<meta name="description" content="Mckeand Technologies. Website coming soon.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { --bg: #000; --fg: #fff; --muted: #a8a8a8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "DejaVu Sans", Verdana, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  main { max-width: 800px; width: 100%; }
  .logo { width: min(720px, 100%); height: auto; display: block; margin: 0 auto 48px; }
  h1 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 700; margin: 0 0 12px; letter-spacing: .02em; }
  p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin: 0 0 8px; }
  a { color: var(--fg); text-underline-offset: 3px; }
  a:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  footer { position: absolute; bottom: 20px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="Mckeand Technologies">
  <h1>Website coming soon</h1>
  <p>For enquiries, email <a href="mailto:info@mckeandtechnologies.ca">info@mckeandtechnologies.ca</a>.</p>
</main>
<footer>&copy; 2026 Mckeand Technologies</footer>
</body>
</html>
