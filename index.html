<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mckeand Technologies</title>
<meta name="description" content="Mckeand Technologies. Website coming soon.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="fonts/dejavu-sans-bold-brand.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "DejaVu Brand";
    src: url("fonts/dejavu-sans-bold-brand.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: block;
  }
  :root {
    --bg: #000; --fg: #fff; --muted: #a8a8a8;
    /* logo size: 840 px wide on large screens, full width on small ones.
       --u is one logo design unit; the whole logo scales from it. */
    --w: min(840px, calc(100vw - 48px));
    --u: calc(var(--w) / 5903);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "DejaVu Sans", Verdana, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  main { width: 100%; }
  .brand { display: flex; align-items: flex-start; gap: calc(60 * var(--u)); width: var(--w); margin: 0 auto 56px; text-align: left; }
  .brand img { flex: none; display: block; width: calc(1758.34 * var(--u)); height: calc(1977 * var(--u)); }
  .brand .name {
    font-family: "DejaVu Brand", "DejaVu Sans", Verdana, sans-serif; font-weight: 700;
    font-size: calc(550 * var(--u)); line-height: calc(697 * var(--u));
    margin-top: calc(301.7 * var(--u)); white-space: nowrap; color: var(--fg);
  }
  h1 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 700; margin: 0 0 12px; letter-spacing: .02em; }
  p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin: 0 0 8px; }
  a { color: var(--fg); text-underline-offset: 3px; }
  a:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  footer { position: absolute; bottom: 20px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <div class="brand" role="img" aria-label="Mckeand Technologies">
    <img src="mark.svg" alt="">
    <div class="name" aria-hidden="true">Mckeand<br>Technologies</div>
  </div>
  <h1>Website coming soon</h1>
  <p>For enquiries, email <a href="mailto:contact@mckeandtechnologies.ca">contact@mckeandtechnologies.ca</a>.</p>
</main>
<footer>&copy; 2026 Mckeand Technologies</footer>
</body>
</html>
